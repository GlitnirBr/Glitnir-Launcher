name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # .exe (instalador NSIS) + blockmap (update delta) + latest.yml (auto-updater)
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-22.04
            name: linux
            # AppImage (auto-updater funciona) + .deb (Debian/Ubuntu, sem auto-update).
            # Não há *.blockmap aqui: no AppImage o blockmap vai embutido no próprio arquivo.
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Sincronizar versão com a tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build -- --publish never

      - name: Subir artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: glitnir-launcher-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # Publica tudo de uma vez só, depois que Windows e Linux terminaram. Se cada job criasse
  # a release em paralelo, os dois disputariam a mesma tag.
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar artefatos dos dois builds
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Criar release e subir arquivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            **Windows:** `GlitnirLauncher-Setup-*.exe`
            **Linux:** `GlitnirLauncher-*-x86_64.AppImage` (recomendado — tem atualização automática) ou `GlitnirLauncher-*-amd64.deb`
          files: dist-release/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
