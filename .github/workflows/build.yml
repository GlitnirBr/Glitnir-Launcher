name: Build

# Build de verificação manual (Windows + Linux). Não publica release — quem publica é o
# release.yml, disparado pela tag v*. Rodar os dois na tag criaria releases duplicadas.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifacts: release/*.exe
          - os: ubuntu-22.04
            name: linux
            artifacts: |
              release/*.AppImage
              release/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitnir-launcher-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
